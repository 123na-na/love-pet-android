plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 密钥不写进源码：从 local.properties（已在 .gitignore 中）读取，缺省为空字符串。
def secretsFile = rootProject.file("local.properties")
def secrets = new Properties()
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
}

android {
    namespace 'com.example.love_pet'
    compileSdk 32

    defaultConfig {
        applicationId "com.example.love_pet"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "QWEN_API_KEY", "\"${secrets.getProperty('QWEN_API_KEY', '')}\""
        buildConfigField "String", "QWEN_TEXT_MODEL", "\"${secrets.getProperty('QWEN_TEXT_MODEL', 'qwen-plus')}\""
        buildConfigField "String", "QWEN_VL_MODEL", "\"${secrets.getProperty('QWEN_VL_MODEL', 'qwen3-vl-plus')}\""
        buildConfigField "String", "BAIDU_APP_ID", "\"${secrets.getProperty('BAIDU_APP_ID', '')}\""
        buildConfigField "String", "BAIDU_API_KEY", "\"${secrets.getProperty('BAIDU_API_KEY', '')}\""
        buildConfigField "String", "BAIDU_SECRET_KEY", "\"${secrets.getProperty('BAIDU_SECRET_KEY', '')}\""
        buildConfigField "String", "AGORA_APP_ID", "\"${secrets.getProperty('AGORA_APP_ID', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = []
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    
    // Room数据库
    implementation 'androidx.room:room-runtime:2.4.3'
    annotationProcessor 'androidx.room:room-compiler:2.4.3'
    
    // Glide图片加载库
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    // uCrop 图片裁剪库
    implementation 'com.github.yalantis:ucrop:2.2.8'

    // OkHttp 网络请求
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    // 高德地图SDK（远程依赖）
    implementation 'com.amap.api:3dmap-location-search:latest.integration'

    // 声网Agora视频通话SDK
    implementation 'io.agora.rtc:full-sdk:4.2.2'

    // 微信SDK
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android:6.8.24'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
